<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrueStepTech | Video Links</title>
<style>
:root{
  --bg:#090d16; --card:rgba(255,255,255,.04); --border:rgba(255,255,255,.09);
  --glow:rgba(59,130,246,.45); --yt:#ff0033; --ytglow:rgba(255,0,51,.4);
  --text:#f8fafc; --muted:#94a3b8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;background:var(--bg);
  background-image:radial-gradient(circle at 20% 20%,rgba(59,130,246,.15),transparent 45%),
                   radial-gradient(circle at 80% 80%,rgba(139,92,246,.12),transparent 45%);
  color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex;justify-content:center;padding:40px 20px 50px;
}
.wrapper{width:100%;max-width:500px;display:flex;flex-direction:column;gap:24px}
header{text-align:center}
header h1{font-size:30px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px;
  background:linear-gradient(135deg,#fff,#94a3b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header p{color:var(--muted);font-size:14px}

.links-feed{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;
  backdrop-filter:blur(14px);transition:border-color .25s}
.card:hover{border-color:rgba(59,130,246,.4)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card-title{font-size:17px;font-weight:600;line-height:1.4}
.badge{background:rgba(59,130,246,.2);color:#60a5fa;border:1px solid rgba(59,130,246,.4);
  font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}

/* ---------- Cat hiding behind the buttons ---------- */
.peek{position:relative;height:74px;pointer-events:none;
  clip-path:inset(-200px -200px 0 -200px)}   /* only the bottom edge clips: the cat appears from behind the buttons */
.cat{position:absolute;bottom:0;left:var(--x,50%);width:120px;margin-left:-60px;
  transform:translateY(108%);transition:transform 1s cubic-bezier(.4,0,.2,1),left .6s ease}
.cat-inner{transform-origin:50% 100%}
.cat svg{display:block;width:120px;height:92px;overflow:visible}
.card[data-mood="sad"] .cat{transform:translateY(0);transition:transform 1.8s cubic-bezier(.2,.7,.2,1),left .6s ease}
.card[data-mood="happy"] .cat{transform:translateY(0);transition:transform 1.3s cubic-bezier(.2,.7,.2,1),left .6s ease}
.card[data-mood="happy"] .cat-inner{animation:hop .6s ease-in-out 1.3s infinite}
.card[data-mood="sad"] .cat-inner{animation:tremble .4s linear 1.8s infinite}

.bubble{position:absolute;top:6px;left:100%;margin-left:-4px;background:#fff;color:#1e293b;font-weight:700;font-size:13px;
  padding:7px 12px;border-radius:12px;white-space:nowrap;opacity:0;transition:opacity .4s;z-index:3}
.card[data-side="left"] .bubble{left:auto;right:100%;margin:0 -4px 0 0}
.card[data-mood="sad"] .bubble,.card[data-mood="happy"] .bubble{opacity:1;transition-delay:.9s}
.card[data-mood="idle"] .bubble{transition-delay:0s}

.part{transform-box:fill-box;transform-origin:center}
.eye{transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.card[data-mood="sad"] .eye{transform:scale(1.4)}
.eyes-happy,.brows,.mouth-sad,.mouth-happy,.tear{opacity:0}
.card[data-mood="happy"] .eyes-normal,.card[data-mood="happy"] .mouth-idle,
.card[data-mood="sad"] .mouth-idle{opacity:0}
.card[data-mood="happy"] .eyes-happy,.card[data-mood="happy"] .mouth-happy,
.card[data-mood="sad"] .mouth-sad,.card[data-mood="sad"] .brows{opacity:1}
.card[data-mood="sad"] .tear{animation:tear 1.6s ease-in 2s infinite}
.ear-l{transform-origin:44px 34px;transition:transform .6s}
.ear-r{transform-origin:76px 34px;transition:transform .6s}
.card[data-mood="sad"] .ear-l{transform:rotate(-16deg)}
.card[data-mood="sad"] .ear-r{transform:rotate(16deg)}
.card[data-mood="happy"] .ear-l{transform:rotate(6deg)}
.card[data-mood="happy"] .ear-r{transform:rotate(-6deg)}
.eyes-normal{animation:blink 4.5s infinite}

@keyframes hop{0%,100%{transform:translateY(0) scale(1.05,.95)}45%{transform:translateY(-30px) scale(.96,1.05)}}
@keyframes tremble{0%,100%{transform:translateX(-1.5px)}50%{transform:translateX(1.5px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes tear{0%{opacity:0;transform:translateY(-4px)}20%{opacity:1}100%{opacity:0;transform:translateY(22px)}}

.actions{position:relative;z-index:2;display:flex;gap:10px}
.btn,.sub-btn{display:flex;align-items:center;justify-content:center;text-decoration:none;color:#fff;
  font-weight:700;border-radius:12px;transition:transform .2s,box-shadow .2s}
.sub-btn{padding:14px 18px;font-size:16px;background:var(--yt);box-shadow:0 4px 16px var(--ytglow)}
.sub-btn:hover,.sub-btn:focus-visible{transform:scale(1.04);box-shadow:0 6px 22px rgba(255,0,51,.6)}
.btn{flex:1;padding:14px 20px;font-size:17px;background:linear-gradient(135deg,#2563eb,#3b82f6);box-shadow:0 4px 20px var(--glow)}
.btn:hover,.btn:focus-visible{transform:scale(1.02)}
a:focus-visible{outline:3px solid #fff;outline-offset:2px}
.disclaimer{padding:14px 18px;border-radius:12px;background:rgba(255,255,255,.02);
  border:1px solid rgba(255,255,255,.05);font-size:13px;color:var(--muted);text-align:center;line-height:1.5}

@media (max-width:380px){.actions{flex-direction:column}.bubble{display:none}}
@media (prefers-reduced-motion:reduce){.cat-inner,.eyes-normal,.tear{animation:none!important}.cat{transition:none!important}}
</style>
</head>
<body>
<div class="wrapper">
  <header>
    <h1>TrueStepTech</h1>
    <p>Official video resources &amp; direct links</p>
  </header>

  <div class="links-feed" id="feed"></div>

  <div class="disclaimer">
    Note: YouTube doesn't allow me to share this type of link directly, so I am using this page instead. Sorry for any inconvenience!
  </div>
</div>

<!-- Cat template (cloned into every card) -->
<template id="cat-tpl">
  <div class="peek" aria-hidden="true">
    <div class="cat">
      <div class="bubble"></div>
      <div class="cat-inner">
        <svg viewBox="0 0 120 92">
          <g class="ear-l"><polygon points="30,42 34,6 60,28" fill="#f0a35e"/><polygon points="37,35 38,17 51,28" fill="#ffb4c0"/></g>
          <g class="ear-r"><polygon points="90,42 86,6 60,28" fill="#f0a35e"/><polygon points="83,35 82,17 69,28" fill="#ffb4c0"/></g>
          <ellipse cx="60" cy="54" rx="34" ry="30" fill="#f2a65a"/>
          <g stroke="#d9823a" stroke-width="3" stroke-linecap="round"><path d="M60 26V36M50 28L52 37M70 28L68 37"/></g>
          <ellipse cx="60" cy="66" rx="15" ry="10" fill="#fff1dd"/>
          <circle cx="36" cy="64" r="5" fill="#ff8fa3" opacity=".45"/><circle cx="84" cy="64" r="5" fill="#ff8fa3" opacity=".45"/>
          <polygon points="55,59 65,59 60,65" fill="#ff8fa3"/>
          <g stroke="rgba(255,255,255,.75)" stroke-width="1.5" stroke-linecap="round"><path d="M30 64L12 60M30 69L12 72M90 64L108 60M90 69L108 72"/></g>
          <!-- normal / big pleading eyes -->
          <g class="eyes-normal part">
            <g class="eye part"><circle cx="46" cy="52" r="8" fill="#2b2230"/><circle cx="43" cy="49" r="3.2" fill="#fff"/><circle cx="49" cy="55" r="1.6" fill="#fff"/></g>
            <g class="eye part"><circle cx="74" cy="52" r="8" fill="#2b2230"/><circle cx="71" cy="49" r="3.2" fill="#fff"/><circle cx="77" cy="55" r="1.6" fill="#fff"/></g>
          </g>
          <g class="eyes-happy" fill="none" stroke="#2b2230" stroke-width="3.5" stroke-linecap="round"><path d="M38 54Q46 43 54 54"/><path d="M66 54Q74 43 82 54"/></g>
          <g class="brows" fill="none" stroke="#b06a2a" stroke-width="3.5" stroke-linecap="round"><path d="M36 42L55 35"/><path d="M65 35L84 42"/></g>
          <g class="mouth-idle" fill="none" stroke="#2b2230" stroke-width="2.5" stroke-linecap="round"><path d="M60 65V69M53 70Q56.5 74 60 69Q63.5 74 67 70"/></g>
          <g class="mouth-sad" fill="none" stroke="#2b2230" stroke-width="2.5" stroke-linecap="round"><path d="M60 65V69M53 76Q60 67 67 76"/></g>
          <g class="mouth-happy"><path d="M52 69Q60 86 68 69Z" fill="#7a2e3a"/><ellipse cx="60" cy="78" rx="4.5" ry="3.5" fill="#ff7a8a"/></g>
          <ellipse class="tear" cx="40" cy="64" rx="2.5" ry="4" fill="#8fd3ff"/>
          <!-- paws gripping the button edge -->
          <ellipse cx="38" cy="87" rx="13" ry="8" fill="#fff1dd" stroke="#e3c9a5"/>
          <ellipse cx="82" cy="87" rx="13" ry="8" fill="#fff1dd" stroke="#e3c9a5"/>
          <path d="M34 82V88M41 82V88M78 82V88M85 82V88" stroke="#e3c9a5" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </div>
</template>

<script>
/* =====================================================
   EDIT THIS SECTION ONLY
   ===================================================== */
// Opens YouTube's subscribe prompt. Change the @handle if yours is different.
const SUBSCRIBE_URL = "https://www.youtube.com/@TrueStepTech?sub_confirmation=1";

// HOW TO ADD A NEW VIDEO:
//   1. Find the next line that starts with  //  (a commented box) below.
//   2. Delete the two slashes  //  at the start of that line.
//   3. Replace the title and the link. Done!
// Keep them in order (oldest first, newest last). The page automatically
// shows the NEWEST video at the top with the LATEST badge.
const VIDEOS = [
  { title: "Sleeping Dogs Not Launching Error (Fix#1)", url: "https://drive.google.com/file/d/1-7NlzrSxFq-zykPSYHADAQYX5bRdD2vH/view?usp=drive_link"  },
  { title: "Watch Dogs Not Launching Error Fix", url: "https://drive.google.com/file/d/1WUIJ4ll_umNuXfeNFhWotqo1iyY38A49/view?usp=drive_link" },
  { title: "Far Cry New Dawn Not Launching Error Fix", url: "https://drive.google.com/file/d/1-ALqYS8ymt9gg9TsHxghFQj8y-ezRCCL/view?usp=drive_link" },
  { title: "Sleeping Dogs Not Launching Error (Fix#2)", url: "https://drive.google.com/file/d/1-7IqhilKDvGq2BcXrT3NPCdC4gPj-IUZ/view?usp=drive_link" },
  { title: "Assassin's Creed Origins Stuck on Splash Screen? Here's the Fix!", url: "https://drive.google.com/file/d/1debAVm1kOlugkSlEHQTb09w_qVGzw9M9/view?usp=drive_link" },
  { title: "Mad Max Crashing at Startup – Here's the Fix!", url: "https://drive.google.com/file/d/1oTFEd6ad1ARLFcAIuLkChfqaIuX2rz5_/view?usp=drive_link" },
  { title: "IDM Without Buying – Simple Trick!", url: "https://github.com/J2TEAM/idm-trial-reset" },
  { title: "Assassin’s Creed Chronicles: China Crash Fix", url: "https://drive.google.com/file/d/1fndkDeBhzMxE8hraAm7xZ0FPoHxp74zn/view?usp=drive_link" },
  { title: "Assassin’s Creed Chronicles: India Crash Fix", url: "https://drive.google.com/file/d/1qPYoE5amf_R2xUtPjKQMzfYEAfdpzUDS/view?usp=drive_link" },
  { title: "Fix 0xc00007b Error in Assassin's Creed 4 Black Flag ", url: "https://www.techpowerup.com/download/visual-c-redistributable-runtime-package-all-in-one/" },
  { title: "Activate Windows 11 Home/Pro Safely & Permanently", url: "https://drive.google.com/file/d/1WWa6NXDX3XL_hZyt8Jp7r1HUXSaTDwEc/view" },
  { title: "Download & Install MS Office for Free", url: "https://getintopc.com/softwares/office-tools/office-tool-plus-2024-free-download/" },

  // ---- Spare boxes: remove the // to turn one on ----
  // { title: "Video 13: Put Your Video Title Here", url: "https://your-link-13.com" },
  // { title: "Video 14: Put Your Video Title Here", url: "https://your-link-14.com" },
  // { title: "Video 15: Put Your Video Title Here", url: "https://your-link-15.com" },
  // { title: "Video 16: Put Your Video Title Here", url: "https://your-link-16.com" },
  // { title: "Video 17: Put Your Video Title Here", url: "https://your-link-17.com" },
  // { title: "Video 18: Put Your Video Title Here", url: "https://your-link-18.com" },
  // { title: "Video 19: Put Your Video Title Here", url: "https://your-link-19.com" },
  // { title: "Video 20: Put Your Video Title Here", url: "https://your-link-20.com" },
  // { title: "Video 21: Put Your Video Title Here", url: "https://your-link-21.com" },
  // { title: "Video 22: Put Your Video Title Here", url: "https://your-link-22.com" },
  // { title: "Video 23: Put Your Video Title Here", url: "https://your-link-23.com" },
  // { title: "Video 24: Put Your Video Title Here", url: "https://your-link-24.com" },
  // { title: "Video 25: Put Your Video Title Here", url: "https://your-link-25.com" },
  // { title: "Video 26: Put Your Video Title Here", url: "https://your-link-26.com" },
  // { title: "Video 27: Put Your Video Title Here", url: "https://your-link-27.com" },
  // { title: "Video 28: Put Your Video Title Here", url: "https://your-link-28.com" },
  // { title: "Video 29: Put Your Video Title Here", url: "https://your-link-29.com" },
  // { title: "Video 30: Put Your Video Title Here", url: "https://your-link-30.com" },
  // { title: "Video 31: Put Your Video Title Here", url: "https://your-link-31.com" },
  // { title: "Video 32: Put Your Video Title Here", url: "https://your-link-32.com" },
];
/* ===================================================== */

const feed = document.getElementById("feed");
const tpl = document.getElementById("cat-tpl");
const SAY = { sad: "Subscribe first, pleeease? 🥺", happy: "Thank you! 💖", idle: "" };

[...VIDEOS].reverse().forEach((v, i) => {  // newest first
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.mood = "idle";

  const top = document.createElement("div");
  top.className = "card-top";
  const h = document.createElement("h2");
  h.className = "card-title";
  h.textContent = v.title;
  top.appendChild(h);
  if (i === 0) {
    const b = document.createElement("span");
    b.className = "badge";
    b.textContent = "LATEST";
    top.appendChild(b);
  }

  const actions = document.createElement("div");
  actions.className = "actions";
  actions.innerHTML =
    '<a class="sub-btn" data-mood="happy" target="_blank" rel="noopener noreferrer">Subscribe</a>' +
    '<a class="btn" data-mood="sad" target="_blank" rel="noopener noreferrer">Open Link ↗</a>';
  actions.children[0].href = SUBSCRIBE_URL;
  actions.children[1].href = v.url;

  card.append(top, tpl.content.cloneNode(true), actions);
  feed.appendChild(card);
});

function setMood(btn, mood){
  const card = btn.closest(".card");
  const peek = card.querySelector(".peek");
  const a = btn.getBoundingClientRect(), p = peek.getBoundingClientRect();
  const x = a.left + a.width / 2 - p.left;
  const cat = card.querySelector(".cat");
  const catHidden = card.dataset.mood === "idle";
  if (catHidden) cat.style.transition = "transform 1s cubic-bezier(.4,0,.2,1)"; // no sideways slide while hidden
  cat.style.setProperty("--x", x + "px");
  card.dataset.side = x > p.width / 2 ? "left" : "right";
  card.dataset.mood = mood;
  card.querySelector(".bubble").textContent = SAY[mood];
  if (catHidden) requestAnimationFrame(() => cat.style.transition = "");
}
function relax(card){ card.dataset.mood = "idle"; }

const target = e => e.target.closest && e.target.closest("[data-mood]");
let touchTimer;

document.addEventListener("mouseover", e => { const t = target(e); if (t) setMood(t, t.dataset.mood); });
document.addEventListener("mouseout",  e => {
  const t = target(e);
  if (t && !t.contains(e.relatedTarget)) relax(t.closest(".card"));
});
document.addEventListener("focusin",  e => { const t = target(e); if (t) setMood(t, t.dataset.mood); });
document.addEventListener("focusout", e => { const t = target(e); if (t) relax(t.closest(".card")); });
// Phones have no hover: react on touch and go back after a few seconds
document.addEventListener("touchstart", e => {
  const t = target(e);
  if (!t) return;
  clearTimeout(touchTimer);
  setMood(t, t.dataset.mood);
  touchTimer = setTimeout(() => relax(t.closest(".card")), 3500);
}, { passive: true });
</script>
</body>
</html>

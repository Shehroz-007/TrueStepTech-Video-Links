<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05080f">
<title>TrueStepTech | Video Links</title>
<style>
:root{
  --bg:#05080f; --panel:rgba(12,20,36,.75); --line:rgba(120,160,220,.16);
  --cyan:#22d3ee; --blue:#3b82f6; --green:#34d399; --red:#ff3b5c; --orange:#ff7a3d;
  --text:#e6edf7; --muted:#7d8ba3;
  --mono:ui-monospace,SFMono-Regular,"Cascadia Code",Consolas,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{
  min-height:100vh;color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(ellipse 70% 40% at 50% -5%,rgba(34,211,238,.16),transparent 70%),
    radial-gradient(ellipse 50% 40% at 100% 100%,rgba(59,130,246,.12),transparent 70%),
    linear-gradient(rgba(120,170,255,.045) 1px,transparent 1px) 0 0/44px 44px,
    linear-gradient(90deg,rgba(120,170,255,.045) 1px,transparent 1px) 0 0/44px 44px,
    var(--bg);
  background-attachment:fixed;
  display:flex;justify-content:center;padding:44px 18px 56px;
}
.wrapper{width:100%;max-width:520px;display:flex;flex-direction:column;gap:26px}

/* ---------- Header ---------- */
header{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:56px;height:56px;flex-shrink:0;filter:drop-shadow(0 0 14px rgba(34,211,238,.45))}
.wordmark{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1}
.wordmark span{background:linear-gradient(135deg,var(--cyan),var(--blue));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tag{font-family:var(--mono);font-size:13px;color:var(--muted)}
.tag b{color:var(--cyan);font-weight:600}
.status{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:1.2px;
  color:var(--green);padding:6px 12px;border-radius:999px;border:1px solid rgba(52,211,153,.3);background:rgba(52,211,153,.07)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.8s ease-in-out infinite}

/* ---------- Cards ---------- */
.links-feed{display:flex;flex-direction:column;gap:16px}
.card{
  --brk:var(--red);
  position:relative;padding:18px;border-radius:14px;
  background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(12px);
  transition:transform .25s,border-color .25s,box-shadow .25s;
  animation:rise .5s ease both;
}
.card[data-state="verifying"]{--brk:var(--cyan)}
.card[data-state="unlocked"]{--brk:var(--green)}
.card::before,.card::after{content:"";position:absolute;width:18px;height:18px;border:2px solid var(--brk);transition:border-color .3s}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:14px}
.card::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:14px}
.card:hover{transform:translateY(-3px);border-color:rgba(34,211,238,.35);box-shadow:0 14px 36px -14px rgba(0,0,0,.8),0 0 24px -10px rgba(34,211,238,.35)}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-family:var(--mono);font-size:11px;letter-spacing:1px}
.idx{color:var(--muted)}
.spacer{flex:1}
.chip,.badge{padding:3px 9px;border-radius:6px;font-weight:600;border:1px solid}
.badge{color:var(--cyan);border-color:rgba(34,211,238,.4);background:rgba(34,211,238,.1)}
.chip{transition:all .3s}
.card[data-state="locked"] .chip{color:#ff6b84;border-color:rgba(255,59,92,.4);background:rgba(255,59,92,.1)}
.card[data-state="verifying"] .chip{color:var(--cyan);border-color:rgba(34,211,238,.4);background:rgba(34,211,238,.1)}
.card[data-state="unlocked"] .chip{color:var(--green);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.1)}
.card-title{font-size:18px;font-weight:650;line-height:1.4;margin-bottom:16px}

.btn{display:flex;align-items:center;justify-content:center;width:100%;padding:15px 20px;border-radius:10px;
  text-decoration:none;color:#fff;font-size:17px;font-weight:700;border:1px solid rgba(255,255,255,.12);
  transition:transform .2s,box-shadow .2s,filter .2s}
.btn.locked{background:linear-gradient(135deg,var(--red),var(--orange));box-shadow:0 6px 22px -6px rgba(255,59,92,.6)}
.btn.verifying{background:linear-gradient(90deg,#0891b2 var(--p,0%),#16212f var(--p,0%));cursor:wait;
  border-color:rgba(34,211,238,.4);font-family:var(--mono);font-size:15px}
.btn.unlocked{background:linear-gradient(135deg,#06b6d4,var(--blue));box-shadow:0 6px 24px -6px rgba(34,211,238,.6)}
.btn:not(.verifying):hover,.btn:focus-visible{transform:translateY(-1px);filter:brightness(1.1)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.hint{margin-top:11px;font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;line-height:1.5}

.note{padding:14px 18px;border-radius:12px;border:1px dashed var(--line);font-family:var(--mono);
  font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
.note b{color:var(--cyan);font-weight:600}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.35}}
@media (max-width:400px){.wordmark{font-size:28px}.logo{width:48px;height:48px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrapper">
  <header>
    <div class="brand">
      <svg class="logo" viewBox="0 0 56 56" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs>
        <rect x="2" y="2" width="52" height="52" rx="14" fill="rgba(34,211,238,.08)" stroke="url(#g)" stroke-width="2"/>
        <path d="M13 41H22V32H31V23H40" fill="none" stroke="url(#g)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="42" cy="15" r="3.5" fill="#22d3ee"/>
      </svg>
      <h1 class="wordmark">TrueStep<span>Tech</span></h1>
    </div>
    <p class="tag"><b>&gt;</b> official video resources &amp; direct links</p>
    <div class="status"><i></i>LINKS ONLINE</div>
  </header>

  <div class="links-feed" id="feed"></div>

  <div class="note"><b>// note:</b> YouTube doesn't allow me to share this type of link directly, so I am using this page instead. Sorry for any inconvenience!</div>
</div>

<script>
/* =====================================================

   ===================================================== */
// Opens YouTube's subscribe prompt. Change the @handle if yours is different.
const SUBSCRIBE_URL = "https://www.youtube.com/@TrueStepTech?sub_confirmation=1";

// Click counter (Firebase Realtime Database URL, no trailing slash).
// Leave as "" to turn counting off. Example: "https://your-project-default-rtdb.firebaseio.com"
const COUNTER_URL = "https://truesteptech-video-links-default-rtdb.firebaseio.com";

// HOW TO ADD A NEW VIDEO:
//   1. Find the next line that starts with  //  (a spare box) below.
//   2. Delete the two slashes  //  at the start of that line.
//   3. Replace the title and the link. Done!
// tag = the filter button it appears under (e.g. "Game Fixes"). New tags make new buttons automatically.
// Keep them in order (oldest first, newest last). The page shows the NEWEST at the top with the LATEST badge.
const VIDEOS = [
  { title: "Sleeping Dogs Not Launching Error (Fix#1)", url: "https://drive.google.com/file/d/1-7NlzrSxFq-zykPSYHADAQYX5bRdD2vH/view?usp=drive_link"  },
  { title: "Watch Dogs Not Launching Error Fix", url: "https://drive.google.com/file/d/1WUIJ4ll_umNuXfeNFhWotqo1iyY38A49/view?usp=drive_link" },
  { title: "Far Cry New Dawn Not Launching Error Fix", url: "https://drive.google.com/file/d/1-ALqYS8ymt9gg9TsHxghFQj8y-ezRCCL/view?usp=drive_link" },
  { title: "Sleeping Dogs Not Launching Error (Fix#2)", url: "https://drive.google.com/file/d/1-7IqhilKDvGq2BcXrT3NPCdC4gPj-IUZ/view?usp=drive_link" },
  { title: "Assassin's Creed Origins Stuck on Splash Screen? Here's the Fix!", url: "https://drive.google.com/file/d/1debAVm1kOlugkSlEHQTb09w_qVGzw9M9/view?usp=drive_link" },
  { title: "Mad Max Crashing at Startup – Here's the Fix!", url: "https://drive.google.com/file/d/1oTFEd6ad1ARLFcAIuLkChfqaIuX2rz5_/view?usp=drive_link" },
  { title: "IDM Without Buying – Simple Trick!", url: "https://github.com/J2TEAM/idm-trial-reset" },
  { title: "Assassin’s Creed Chronicles: China Crash Fix", url: "https://drive.google.com/file/d/1fndkDeBhzMxE8hraAm7xZ0FPoHxp74zn/view?usp=drive_link" },
  { title: "Assassin’s Creed Chronicles: India Crash Fix", url: "https://drive.google.com/file/d/1qPYoE5amf_R2xUtPjKQMzfYEAfdpzUDS/view?usp=drive_link" },
  { title: "Fix 0xc00007b Error in Assassin's Creed 4 Black Flag ", url: "https://www.techpowerup.com/download/visual-c-redistributable-runtime-package-all-in-one/" },
  { title: "Activate Windows 11 Home/Pro Safely & Permanently", url: "https://drive.google.com/file/d/1WWa6NXDX3XL_hZyt8Jp7r1HUXSaTDwEc/view" },
  { title: "Download & Install MS Office for Free", url: "https://getintopc.com/softwares/office-tools/office-tool-plus-2024-free-download/" },

  // ---- Spare boxes: remove the // to turn one on ----
  // { title: "Video 10: Put Your Video Title Here", tag: "Game Fixes", url: "https://your-link-10.com" },
  // { title: "Video 11: Put Your Video Title Here", tag: "Game Fixes", url: "https://your-link-11.com" },
  // { title: "Video 12: Put Your Video Title Here", tag: "Game Fixes", url: "https://your-link-12.com" },

  // { title: "Video 14: Put Your Video Title Here", tag: "Game Fixes", url: "https://your-link-14.com" },
  // { title: "Video 15: Put Your Video Title Here", tag: "Game Fixes", url: "https://your-link-15.com" },
  // { title: "Video 16: Put Your Video Title Here", tag: "Game Fixes", url: "https://your-link-16.com" },
  // { title: "Video 17: Put Your Video Title Here", tag: "Game Fixes", url: "https://your-link-17.com" },
  // { title: "Video 18: Put Your Video Title Here", tag: "Game Fixes", url: "https://your-link-18.com" },
  // { title: "Video 19: Put Your Video Title Here", tag: "Game Fixes", url: "https://your-link-19.com" },
  // { title: "Video 20: Put Your Video Title Here", tag: "Game Fixes", url: "https://your-link-20.com" },

  // { title: "Video 23: Put Your Video Title Here", tag: "Game Fixes", url: "https://your-link-23.com" },

  // { title: "Video 34: Put Your Video Title Here", tag: "Game Fixes", url: "https://your-link-34.com" },
  // { title: "Video 35: Put Your Video Title Here", tag: "Game Fixes", url: "https://your-link-35.com" },
  // { title: "Video 36: Put Your Video Title Here", tag: "Game Fixes", url: "https://your-link-36.com" },
  // { title: "Video 37: Put Your Video Title Here", tag: "Game Fixes", url: "https://your-link-37.com" },
  // { title: "Video 38: Put Your Video Title Here", tag: "Game Fixes", url: "https://your-link-38.com" },
  // { title: "Video 39: Put Your Video Title Here", tag: "Game Fixes", url: "https://your-link-39.com" },
];
/* ===================================================== */

const feed = document.getElementById("feed");

// ---- Click counter ----
// Firebase keys can't contain . # $ [ ] / so the title is cleaned up. Don't rename a title
// after publishing, or its count starts again from zero under the new name.
function keyOf(title){ return title.trim().replace(/[^A-Za-z0-9]+/g, "_").slice(0, 80); }
function track(path){
  if (!COUNTER_URL || !path) return;
  const [folder, key] = path.split("/");
  try {
    fetch(COUNTER_URL + "/" + folder + ".json", {
      method: "PATCH", keepalive: true,
      body: JSON.stringify({ [key]: { ".sv": { increment: 1 } } })
    }).catch(() => {});
  } catch (e) {}
}

// ---- Sub2Unlock (honor system: the page cannot really check YouTube) ----
const VERIFY_SECONDS = 5;   // how long "Verifying…" lasts after they come back
let verifying = false;
let unlockedKeys = [];      // kept in memory only: a refresh locks everything again

function render(card){
  const a = card.querySelector(".btn"), key = card.dataset.key;
  const open = unlockedKeys.includes(key);
  card.dataset.state = open ? "unlocked" : "locked";
  a.className = "btn " + card.dataset.state;
  a.href = open ? card._url : SUBSCRIBE_URL;
  a.dataset.track = (open ? "opens/" : "subscribes/") + key;
  a.textContent = open ? "Open Link ↗" : "🔒 Subscribe to unlock";
  card.querySelector(".chip").textContent = open ? "UNLOCKED" : "LOCKED";
  card.querySelector(".hint").textContent = open
    ? "Unlocked. Thanks for subscribing!"
    : "Subscribe on YouTube, then come back to unlock this link.";
  a.style.removeProperty("--p");
}

[...VIDEOS].reverse().forEach((v, i) => {   // newest first
  const card = document.createElement("div");
  card.className = "card";
  card.style.animationDelay = (i * 70) + "ms";
  card.dataset.key = keyOf(v.title);
  card._url = v.url;

  const top = document.createElement("div");
  top.className = "card-top";
  const num = VIDEOS.length - i;
  top.innerHTML = '<span class="idx">#' + String(num).padStart(2, "0") + '</span><span class="spacer"></span>' +
                  (i === 0 ? '<span class="badge">LATEST</span>' : "") + '<span class="chip"></span>';

  const h = document.createElement("h2");
  h.className = "card-title";
  h.textContent = v.title;

  const a = document.createElement("a");
  a.className = "btn";
  a.target = "_blank";
  a.rel = "noopener noreferrer";

  const hint = document.createElement("p");
  hint.className = "hint";
  hint.setAttribute("aria-live", "polite");

  card.append(top, h, a, hint);
  feed.appendChild(card);
  render(card);
});

function startVerify(card, a){
  verifying = true;
  card.dataset.state = "verifying";
  a.className = "btn verifying";
  card.querySelector(".chip").textContent = "VERIFYING";
  card.querySelector(".hint").textContent = "Checking your subscription… stay on this page.";
  let left = VERIFY_SECONDS;
  a.textContent = "Verifying subscription… " + left + "s";
  const tick = setInterval(() => {
    if (document.visibilityState !== "visible") return;   // counts only while they are back on this page
    left--;
    a.style.setProperty("--p", ((VERIFY_SECONDS - left) / VERIFY_SECONDS * 100) + "%");
    if (left > 0) { a.textContent = "Verifying subscription… " + left + "s"; return; }
    clearInterval(tick);
    verifying = false;
    unlockedKeys.push(card.dataset.key);                  // unlocks only THIS video
    render(card);
    card.querySelector(".hint").textContent = "Unlocked! Thank you for subscribing 🎉";
  }, 1000);
}

feed.addEventListener("click", e => {
  const a = e.target.closest(".btn");
  if (!a) return;
  if (a.classList.contains("verifying") || (a.classList.contains("locked") && verifying)) { e.preventDefault(); return; }
  track(a.dataset.track);
  if (a.classList.contains("locked")) startVerify(a.closest(".card"), a);
});
feed.addEventListener("auxclick", e => {                 // middle-click opens in a new tab too
  const a = e.target.closest(".btn");
  if (a && e.button === 1 && !a.classList.contains("verifying")) track(a.dataset.track);
});
</script>
</body>
</html>
